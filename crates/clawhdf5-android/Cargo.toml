[package]
name = "clawhdf5-android"
version = "2.1.0"
edition = "2024"
description = "Android JNI bridge for edgehdf5-memory HDF5 backend"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `integrity` is the agent's content Merkle root (write it, verify it on
# read). The bridge used to build with every default feature off, so Android
# stores carried no root and were never verified, and a strict open could
# never succeed (2026-10 red-team finding). The heavier defaults (hnsw, half)
# stay off.
clawhdf5-agent = { path = "../clawhdf5-agent", default-features = false, features = ["integrity"] }

[dev-dependencies]
tempfile = "3"
