[package]
name = "clawhdf5"
version = "2.1.0"
edition = "2024"
description = "Pure-Rust HDF5 reader/writer — no C dependencies"
license = "MIT"
repository = "https://github.com/redclawsystems/clawhdf5"
readme = "README.md"
keywords = ["hdf5", "science", "data", "binary"]
categories = ["parser-implementations", "science", "encoding"]

[dependencies]
clawhdf5-format = { path = "../clawhdf5-format", version = "2.1.0" }
clawhdf5-io = { path = "../clawhdf5-io", version = "2.1.0" }
rayon = { version = "1", optional = true }
# Only pulled in by the `bench-ed25519-fast` feature, to switch on
# ed25519-dalek's precomputed base-point tables for benchmark builds.
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["fast"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
clawhdf5-io = { path = "../clawhdf5-io", version = "2.1.0", features = ["mmap"] }
clawhdf5-format = { path = "../clawhdf5-format", version = "2.1.0", features = ["parallel", "fast-checksum", "baselines", "merkle"] }
clawhdf5-filters = { path = "../clawhdf5-filters", version = "2.1.0" }
libc = "0.2"

[[example]]
name = "phase1_bench"
required-features = []

[[example]]
name = "fourway_bench"
required-features = []

[[bench]]
name = "mmap_bench"
harness = false

[[bench]]
name = "parallel_bench"
harness = false

[features]
default = ["mmap", "fast-deflate"]
mmap = ["clawhdf5-io/mmap"]
parallel = ["clawhdf5-format/parallel", "rayon"]
fast-deflate = ["clawhdf5-format/fast-deflate"]
apple-compression = []
zstd = ["clawhdf5-format/zstd"]
blake3_hash = ["clawhdf5-format/blake3_hash"]
lz4 = ["clawhdf5-format/lz4"]
pcodec = ["clawhdf5-format/pcodec"]
# Benchmark-only: enable ed25519-dalek's `fast` (precomputed tables) so the
# per-chunk Ed25519 baseline signs at its representative speed. Off by
# default so existing benchmark numbers stay reproducible.
bench-ed25519-fast = ["dep:ed25519-dalek"]

[package.metadata.docs.rs]
features = ["mmap"]
targets = ["x86_64-unknown-linux-gnu"]
